    <script>
        //method 1
        function greet(name){
            return `Hello ${name}`;
        }
        console.log(greet("John"));

        //method 3-->Arrow function
        let sum = (x,y) => x+y;

        console.log(sum(2,3));

        let add = function(x,y){
            return x+y;
        }
        console.log(add(4,3));

        
    //creating a default parameter
        function greetUser(name="Anju"){
            return `welcome ${name}`;
        }
        console.log(greetUser()); // Output: welcome Anju
        console.log(greetUser("Alice")); // Output: welcome Alice

    </script>
